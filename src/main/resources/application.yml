server:
  # Behind the TLS-terminating proxy (PRD §27) the app sees plain http; honour the proxy's
  # X-Forwarded-Proto/Host so absolute links in emails and redirects come out as https.
  forward-headers-strategy: native
  servlet:
    session:
      # PRD §19.1 idle timeout. The 24 h ABSOLUTE cap is not expressible here — this setting
      # only measures inactivity — and is enforced by AbsoluteSessionTimeoutFilter.
      timeout: 8h
      cookie:
        http-only: true
        # Secure defaults to on; the dev profile turns it off because dev runs over plain
        # HTTP on *.localhost and the browser would otherwise never send the cookie back.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: caderly-hr
  web:
    # PRD §7 NFR "Internationalization": English only for MVP. FIXED means every request
    # resolves to `locale` below regardless of Accept-Language, so a browser set to French
    # today still gets English — switchable locale resolution is Phase 2's job, once a
    # second messages_xx.properties bundle actually exists (ADR 0013).
    locale-resolver: FIXED
    locale: en
    error:
      # Pinned, not left to the default (CLAUDE.md §6 A05). Boot's own default is already NEVER,
      # but spring-boot-devtools raises these to ALWAYS through its default property source, so a
      # dev error response carried a full stack trace: package layout, framework versions, the
      # entire filter chain. Setting them explicitly wins over devtools and makes the behaviour
      # identical in every profile instead of depending on which jars are on the classpath.
      #
      # NOTE the namespace. These moved from `server.error.*` to `spring.web.error.*` in Boot
      # 4.0.0, and the old keys are deprecated at level=error — meaning Boot silently ignores
      # them rather than failing. `server.error.include-stacktrace: never` looks correct, is
      # accepted without warning, and does nothing at all.
      include-stacktrace: never
      include-exception: false
      include-message: never
      include-binding-errors: never
    resources:
      cache:
        cachecontrol:
          # Static assets (favicons, css, js, fonts) carry their own Cache-Control. Without one,
          # Spring Security stamps `no-store` on them, which stops browsers keeping the favicon
          # (the tab icon never appears) and re-downloads every stylesheet on every page.
          max-age: 1h
          cache-public: true
  messages:
    # Boot only auto-configures a MessageSource when the no-suffix default bundle exists
    # (src/main/resources/messages.properties) — writing `basename: messages` here is
    # Boot's own default, kept explicit as self-documentation (ADR 0013).
    basename: messages
    encoding: UTF-8
    # No silent fallback to the JVM's default locale: an unset/unmapped key must resolve
    # through messages.properties or fail loud, never guess based on server locale.
    fallback-to-system-locale: false
  data:
    jpa:
      repositories:
        # Discriminator multi-tenancy (@TenantId, ADR 0004) resolves a tenant for every
        # Hibernate session, including the eager query validation Spring Data normally
        # does at startup for EVERY repository - even TenantRepository, which must be
        # queryable before any tenant is known (it's what resolves the tenant). LAZY
        # defers that first touch to actual first invocation, which for TenantRepository
        # happens inside TenantService#bySlug's TenantContext.runAsSystem(...) block.
        bootstrap-mode: lazy
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: caderly_hr
  flyway:
    enabled: true
    schemas: caderly_hr
  servlet:
    multipart:
      # Above caderly.storage.max-file-size (25MB) on purpose: a normal oversize upload should
      # fail inside UploadValidator with a friendly inline message, not abort here as a raw
      # MaxUploadSizeExceededException. This is the backstop for a non-browser client bypassing
      # the app's own limit (ADR 0012).
      max-file-size: 30MB
      max-request-size: 32MB

# Tenant subdomains sit under this domain ({slug}.caderly.app in prod, {slug}.localhost
# in dev). Prod profile overrides via CADERLY_BASE_DOMAIN / caderly.base-domain.
caderly:
  base-domain: localhost
  # How a tenant's own origin is spelled when no request is at hand (e.g. the logo address baked
  # into an email at enqueue time, which mail clients fetch from outside the app).
  public-scheme: https
  public-port:
  email:
    # No default: a wrong From address silently lands mail in spam, so an unset value
    # should stop startup rather than be guessed (CLAUDE.md §6 A05 - no defaults in yml).
    from: ${CADERLY_EMAIL_FROM}
    dispatcher:
      # Turned off in tests so they can drain the outbox at a known moment instead of
      # racing the scheduler.
      enabled: true
      poll-interval-ms: 30000
  people:
    # AES-256-GCM key for CryptoConverter (ADR 0008, CLAUDE.md §6 A02) — base64, 32 raw bytes.
    # No default: an unset key must fail startup, never silently encrypt with a guessed value.
    encryption-key: ${CADERLY_EMPLOYEE_ENCRYPTION_KEY}
    termination-job:
      enabled: true
      # Once a day is enough: termination_date is a date, not a timestamp, so nothing is
      # lost by not reacting within the same minute the clock crosses midnight.
      cron: "0 0 0 * * *"
    daily-reminder-job:
      enabled: true
      # Birthdays, work anniversaries and expiring government IDs (PRD §17.2). Early enough
      # that a birthday email arrives before the team has said it in person.
      cron: "0 0 8 * * *"
  timeoff:
    holiday-reminder-job:
      enabled: true
      # Evening, not midnight: "tomorrow" has to still read as tomorrow to someone who opens
      # the mail before bed.
      cron: "0 0 17 * * *"
  storage:
    # S3-compatible backend is deferred (ADR 0012) — "local" is the only value LocalFileStorage's
    # @ConditionalOnProperty currently matches.
    backend: local
    local:
      root: ${CADERLY_STORAGE_ROOT:./data/files}
    # PRD §6.7 FR-7.3. Below the servlet's spring.servlet.multipart.max-file-size so an oversize
    # upload fails inside UploadValidator with a friendly inline message, not a raw 413 (ADR 0012).
    max-file-size: 25MB
  signup:
    # Self-serve sign-up on the public site (ADR 0022). Off unless CADERLY_SIGNUP_ENABLED=true:
    # it stays closed until the Terms/Privacy/DPA drafts have been reviewed, and this one flag
    # closes it again if the form is ever abused. Links already sent keep working when it's off.
    enabled: ${CADERLY_SIGNUP_ENABLED:false}
    # Employees a self-serve workspace may hold (tenant.seat_limit, ADR 0022 decision F).
    seat-limit: 50
    # Most self-serve sign-ups accepted in any 24 hours, across all visitors. Caps abuse and the
    # confirmation mail each one sends; the per-IP and per-email limits in RateLimitFilter stay.
    daily-limit: ${CADERLY_SIGNUP_DAILY_LIMIT:20}
    cleanup-job:
      enabled: true
      # Hourly: expired holds release their address within the hour.
      cron: "0 15 * * * *"
  superadmin:
    # Blank defaults are deliberate here, unlike caderly.email.from or caderly.people.encryption-key
    # above: there is no safe default Super Admin password to fall back to, but every environment
    # that isn't bootstrapping one right now (CI, tests, a pilot tenant that already provisioned
    # its Super Admin by hand) must still be able to start with nothing set. SuperAdminBootstrap
    # treats blank-or-unset as "don't bootstrap" rather than failing closed (CLAUDE.md §6 A05's
    # usual rule is inverted here on purpose — see that class's Javadoc).
    bootstrap-email: ${CADERLY_SUPERADMIN_EMAIL:}
    bootstrap-password: ${CADERLY_SUPERADMIN_PASSWORD:}
    # Comma-separated CIDRs allowed to reach /superadmin/** at all (SuperAdminIpAllowlistFilter).
    # Blank here means nobody — the filter fails closed, so an unset CADERLY_SUPERADMIN_IP_ALLOWLIST
    # makes the console permanently 403 rather than publicly reachable. That is the intended
    # behaviour, not a missing default: this allowlist is the console's second factor, and a
    # "0.0.0.0/0" fallback would quietly remove it. Every real deployment must set the variable
    # (e.g. "203.0.113.4/32,10.0.0.0/8").
    #
    # Deployment requirement, not a suggestion: the address judged here is ClientIpResolver's
    # first X-Forwarded-For hop, so Caddy (PRD §27) must *set* that header rather than append to
    # it, and the app's own port must not be reachable from outside the proxy. Append-or-trust
    # leaves the header attacker-controlled, and a forged "X-Forwarded-For: <allowlisted>"
    # reduces the console to password-only — the same posture this setting exists to prevent.
    ip-allowlist: ${CADERLY_SUPERADMIN_IP_ALLOWLIST:}

management:
  endpoints:
    web:
      # Pinned to health and prometheus (CLAUDE.md §6 A05) so adding an actuator starter can never
      # expose env, heapdump or beans by default. Neither is permitted on the application port by
      # the security chain except /actuator/health; deployments move the whole actuator to a
      # loopback-only management port (docker-compose.yml) so Prometheus scrapes it locally.
      exposure:
        include: health,prometheus

logging:
  level:
    root: info
    com.caderly.caderlyhr: info
  # CLAUDE.md §6 A09 / ADR 0017: Spring Boot's built-in structured logging (no extra dependency),
  # which folds MDC entries (requestId/tenantId/actorId — tenant.TenantResolutionFilter and
  # security.ActorMdcFilter) into every emitted JSON line automatically.
  structured:
    format:
      console: logstash
