# Test profile. The datasource comes from TestcontainersConfiguration's @ServiceConnection,
# so nothing here configures one.
logging:
  structured:
    format:
      # Plain text during test runs: JSON console output has no benefit for a human reading a
      # failing test's log, and MDC population is asserted directly, not parsed from log text.
      console:

spring:
  mail:
    # Overridden per-test by GreenMail's random port where the SMTP path is under test;
    # this default just keeps the JavaMailSender bean constructible everywhere else.
    host: localhost
    port: 3025

management:
  health:
    mail:
      # Tests that replace JavaMailSender with a mock leave this contributor with no
      # JavaMailSenderImpl to inspect, and it fails context startup rather than degrading.
      enabled: false

caderly:
  base-domain: localhost
  signup:
    # Open in tests; SignupServiceTest flips it per case to cover the closed state.
    enabled: true
    # The test database is shared across classes, so the production cap of 20 would trip once
    # enough of them have signed up; the cap itself is covered by SignupServiceDailyLimitTest.
    daily-limit: 100000
    cleanup-job:
      # Tests call SignupService.purgeExpired() directly at a known moment.
      enabled: false
  email:
    from: no-reply@caderly.test
    dispatcher:
      # Tests drive the outbox by calling dispatchPending() directly, so that assertions run
      # at a known point rather than racing a 30-second scheduler.
      enabled: false
  people:
    # Test-only fixed key (ADR 0008) — never used outside src/test.
    encryption-key: 9QUnvMKRTuBhtr+6LF60m694q3P36vRsbU+uDXI1RVo=
    termination-job:
      # Tests drive the job by calling its public method directly at a known moment, matching
      # EmailDispatcher's pattern.
      enabled: false
    daily-reminder-job:
      enabled: false
  timeoff:
    holiday-reminder-job:
      enabled: false
  storage:
    backend: local
    local:
      # Under target/, not the project root — cleaned by `mvn clean`, never committed.
      root: target/test-storage
    max-file-size: 25MB
  superadmin:
    # MockMvc's default client address, so /superadmin/** is reachable in tests without every
    # request faking a header. A case that wants to look like an outside client sends an
    # X-Forwarded-For instead (SuperAdminSecurityConfigTest).
    ip-allowlist: 127.0.0.1/32
